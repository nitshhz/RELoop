<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — ReLoop</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #F7F5F0;
        color: #20251F;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: #FFFFFF;
        max-width: 440px;
        width: 100%;
        padding: 2.5rem 2rem;
        border-radius: 1.5rem;
        text-align: center;
        border: 1px solid #E2E0D8;
        box-shadow: 0 4px 20px -2px rgba(32, 37, 31, 0.05), inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.5rem;
        font-weight: 800;
        color: #356B50;
        margin-bottom: 1.5rem;
      }
      .icon-circle {
        width: 64px;
        height: 64px;
        background-color: #DCE9DD;
        color: #356B50;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
      }
      p {
        color: #74786F;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background-color: #356B50;
        color: #FFFFFF;
        font-weight: 600;
        padding: 0.85rem 1.75rem;
        border-radius: 1rem;
        text-decoration: none;
        cursor: pointer;
        border: none;
        font-size: 0.95rem;
        box-shadow: 0 4px 12px rgba(53, 107, 80, 0.2);
        transition: background 0.2s ease;
      }
      .btn:hover {
        background-color: #28523D;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <span>🔄 ReLoop</span>
      </div>
      <div class="icon-circle">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You are currently offline</h1>
      <p>
        ReLoop requires an active internet connection to browse live listings, submit offers, and message sellers. Please check your network connection.
      </p>
      <button class="btn" onclick="window.location.reload()">
        Retry Connection
      </button>
    </div>
  </body>
</html>
