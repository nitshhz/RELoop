<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#356B50" />
    <meta name="description" content="ReLoop - Buy smarter. Sell easier. Waste less. Peer-to-peer secondhand marketplace." />
    
    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA & Mobile Web App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ReLoop" />
    
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <title>ReLoop — Buy smarter. Sell easier. Waste less.</title>
    
    <!-- Instant First-Visit Intro Pre-Paint Shield -->
    <script>
      (function() {
        try {
          var search = window.location.search || '';
          var force = search.indexOf('intro=true') !== -1 || search.indexOf('splash=true') !== -1;
          var seen = sessionStorage.getItem('reloop_intro_seen');
          if (!seen || force) {
            document.documentElement.classList.add('reloop-intro-active');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html.reloop-intro-active,
      html.reloop-intro-active body {
        background-color: #0D130F !important;
      }
    </style>
  </head>
  <body class="bg-background text-text-primary antialiased selection:bg-brand-green-soft selection:text-brand-green">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration bypassed:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
