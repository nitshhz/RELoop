<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#356B50" />
    <meta name="description" content="ReLoop - Buy smarter. Sell easier. Waste less. Peer-to-peer secondhand marketplace." />
    
    <!-- PWA & Mobile Web App -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ReLoop" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <title>ReLoop — Buy smarter. Sell easier. Waste less.</title>
  </head>
  <body class="bg-background text-text-primary antialiased selection:bg-brand-green-soft selection:text-brand-green">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration bypassed:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
